name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 required: the intelligence test suite (plain Node, no
          # bundler) imports pesticideRegistry.js → agrichem .ts data files,
          # which needs native type-stripping (Node ≥22.18). Node 20 throws
          # ERR_UNKNOWN_FILE_EXTENSION '.ts' in registryValidation.test.mjs.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npx eslint src/ api/ --ext .js,.jsx --no-warn-ignored --max-warnings 50

      - name: Format
        run: npm run format:check

      - name: Offline model check
        run: node scripts/sync_kaggle_models.mjs --check

      - name: Offline unit tests
        run: node src/offline/test-ensemble.mjs

      - name: Intelligence unit tests (diagnosis, risk, protection, MoA, ledger, cases)
        run: npm test

      - name: Build
        run: npm run build
        env:
          CI: true
