name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npx eslint src/ api/ --ext .js,.jsx --no-warn-ignored --max-warnings 50

      - name: Format
        run: npm run format:check

      - name: Offline model check
        run: node scripts/sync_kaggle_models.mjs --check

      - name: Offline unit tests
        run: node src/offline/test-ensemble.mjs

      - name: Build
        run: npm run build
        env:
          CI: true
